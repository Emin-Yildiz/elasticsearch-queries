# Bu kurala verdiğimiz isim — loglarda ve uyarı başlıklarında görünür
name: High Error Rate

# Kuralların türü — 'frequency' tipi, belirli süre içinde belli sayıda olay arar
type: frequency

# İzlenecek Elasticsearch index — burada logs- ile başlayan tüm index'ler taranır
index: user-*

# Belirtilen süre zarfında bu kadar olay olursa uyarı tetiklenir
num_events: 10  # Yani 5 dakikada 100 adet "error" varsa uyarı ver

# Ne kadar süre içinde bu olaylar sayılacak?
timeframe:
  minutes: 1  # Son 5 dakika

# Elasticsearch sorgu filtresi — sadece level: "error" olan loglara bakılır
filter:
  - term:
      level: "info"

# Uyarı tetiklendiğinde ne yapılacak — burada e-posta gönderiliyor
alert:
  - "email"

# Uyarının gönderileceği e-posta adres(ler)i
email:
  - "eminyildiz122@gmail.com"
